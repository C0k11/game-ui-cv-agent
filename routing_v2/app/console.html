<!doctype html>
<meta charset="utf-8">
<title>日常</title>
<!--
  日常 / 推图 / 角色 / 课程表找人 / 体力 / 商店。
  日常顺序固定，不去手关。选项来自词表，不扫屏。
  头像走老前端同一套 /api/v1/captures/image?path=角色头像/
  背景循环播本机 Wallpaper Engine 2799877694 的 ArisuWallpaper.mp4（/v2/wallpaper）。
-->
<style>
  :root{
    --bg:#0a1220;
    --panel:rgba(18,32,54,.82);
    --inset:rgba(13,26,46,.78);
    --line:#2c4a7a;
    --line2:#203a75;
    --fg:#e6eef6;
    --muted:#8aa0b8;
    --accent:#5eb0d4;
    --ok:#5aaf7a;
    --warn:#d4a84a;
    --bad:#d46a62;
    --gold:#c9a24a;
    --font:"Microsoft YaHei","Noto Sans SC","Source Han Sans SC",sans-serif;
    --mono:Consolas,"Cascadia Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.5 var(--font)}
  #bgv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
       z-index:0;pointer-events:none}
  body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
              background:rgba(10,18,32,.38)}
  a{color:var(--accent)}
  .wrap{position:relative;z-index:1;
        display:grid;grid-template-columns:minmax(420px,1fr) minmax(400px,1fr);
        gap:10px;padding:12px;min-height:100vh}
  @media(max-width:1000px){.wrap{grid-template-columns:1fr}}
  .col{display:flex;flex-direction:column;gap:10px;min-height:0}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:10px 12px}
  .panel h2{margin:0 0 8px;font-size:13px;font-weight:700;color:var(--fg);
            letter-spacing:.4px;padding-left:8px;border-left:3px solid var(--line2)}
  .panel h2 .sub{color:var(--muted);font-weight:400;font-size:11px;margin-left:8px}
  button{background:var(--inset);color:var(--fg);border:1px solid var(--line);
         border-radius:2px;padding:4px 10px;cursor:pointer;font:12px var(--font)}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.4;cursor:not-allowed}
  .primary{background:var(--line2);border-color:#3d5c8c}
  .danger{background:#3a1c1c;border-color:#7a3a3a;color:#f0c8c8}
  input,select,textarea{background:var(--inset);color:var(--fg);border:1px solid var(--line);
    border-radius:2px;padding:4px 7px;font:12px var(--font)}
  input[type=number]{width:72px}
  input[type=checkbox]{accent-color:var(--accent)}
  label{font-size:12px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .field{display:flex;gap:8px;align-items:flex-start;padding:5px 0;
         border-bottom:1px solid #1a2c48}
  .field:last-child{border-bottom:0}
  .field>.k{flex:0 0 132px;color:var(--muted);font-size:12px;padding-top:3px}
  .field>.v{flex:1;min-width:0}
  .note{color:var(--muted);font-size:11px;margin-top:4px;line-height:1.45}
  .chain{padding:8px 10px;background:var(--inset);border:1px solid var(--line);
         border-left:3px solid var(--accent);font-size:13px;line-height:1.6}
  .pill{display:inline-block;padding:1px 7px;border-radius:2px;font-size:11px;
        border:1px solid var(--line);font-family:var(--mono)}
  .pill.ok{color:var(--ok);border-color:#2f5f43}
  .pill.bad{color:var(--bad);border-color:#6e3030}
  .pill.warn{color:var(--warn);border-color:#6d5a26}
  .pill.idle{color:var(--muted)}
  .chip{display:inline-flex;align-items:center;background:var(--inset);
        border:1px solid var(--line);border-radius:2px;padding:2px 8px;font-size:12px;
        cursor:pointer;user-select:none}
  .chip.on{border-color:var(--accent);color:var(--accent)}
  .chip.locked{opacity:.55;cursor:not-allowed}
  #log{background:var(--inset);border:1px solid var(--line);border-radius:2px;
       font:11px/1.5 var(--mono);padding:8px;height:280px;overflow:auto;
       white-space:pre-wrap;word-break:break-all}
  #approve{border:1px solid var(--gold);background:#241e0c}
  #approve.money{border-color:var(--bad);background:#2a1414}
  .kv{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .maprow{display:flex;gap:6px;align-items:center;margin-bottom:4px}
  .maprow input[type=text]{flex:1;min-width:0}
  table.bal{border-collapse:collapse;font-family:var(--mono);font-size:11px;width:100%}
  table.bal td{padding:2px 6px;border-bottom:1px solid #1a2c48}
  table.bal td:last-child{text-align:right}
  .warnbox{border:1px solid #6d5a26;background:#241e0c;border-radius:2px;
           padding:8px;font-size:11px;color:var(--warn);line-height:1.5}
  details.expert{border:1px solid var(--line);padding:6px 8px;background:var(--inset)}
  details.expert>summary{cursor:pointer;color:var(--muted);font-size:12px}
  .fav-tray{display:flex;flex-wrap:wrap;gap:8px;min-height:72px;padding:8px;
            background:var(--inset);border:1px dashed var(--line);margin-bottom:8px}
  .fav-tray.empty::before{content:"未选角色, 下面按学园点头像, 上面可搜";color:var(--muted);
            font-size:11px;width:100%;text-align:center;align-self:center;padding:12px 0}
  .fav-tray-item{position:relative;display:flex;flex-direction:column;align-items:center;
                 padding:4px;border:1px solid var(--accent);background:var(--panel);cursor:default}
  .fav-tray-item .priority-badge{position:absolute;top:-5px;left:-5px;background:var(--gold);
        color:#1c1409;font-size:10px;font-weight:700;min-width:17px;height:17px;padding:0 4px;
        line-height:17px;text-align:center}
  .fav-tray-item .remove-btn{position:absolute;top:-6px;right:-6px;background:var(--bad);
        color:#fff;font-size:10px;width:16px;height:16px;line-height:16px;text-align:center;
        cursor:pointer}
  .char-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));
             gap:6px;max-height:320px;overflow-y:auto;padding:8px;
             background:var(--inset);border:1px solid var(--line)}
  .char-group-h{grid-column:1/-1;font-size:11px;color:var(--muted);letter-spacing:.4px;
                border-bottom:1px solid var(--line);padding:6px 2px 3px}
  .char-grid-err{grid-column:1/-1;text-align:center;color:var(--bad);font-size:12px;
                 padding:18px 0;cursor:pointer;border:1px dashed var(--line)}
  .char-item{display:flex;flex-direction:column;align-items:center;cursor:pointer;
             padding:4px;border:1px solid transparent}
  .char-item:hover{background:#182844;border-color:var(--line)}
  .char-item.hidden{display:none}
  .char-avatar{width:44px;height:44px;object-fit:cover;border-radius:2px;pointer-events:none}
  .char-name{font-size:9px;margin-top:3px;text-align:center;color:var(--muted);
             overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
             -webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;pointer-events:none}
  .fav-search{width:100%;padding:6px 9px;margin-bottom:8px;background:var(--inset);
              border:1px solid var(--line);color:var(--fg);font-size:12px}
  .fav-search:focus{border-color:var(--accent);outline:none}
  .farm-row{display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap}
  .farm-row .lab{color:var(--muted);font-size:11px}
  .farm-row input[type=number]{width:72px}
  .farm-add{margin-top:4px}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:var(--bg)}
  ::-webkit-scrollbar-thumb{background:#2c4a7a}
</style>

<video id="bgv" autoplay muted loop playsinline disablepictureinpicture
       controlslist="nodownload nofullscreen noremoteplayback"
       src="/v2/wallpaper"></video>

<div class="wrap">
  <div class="col">
    <div class="panel">
      <div class="row" style="margin-bottom:8px">
        <button class="primary" id="btn_run">开跑</button>
        <button class="danger" id="btn_stop" disabled>停</button>
        <button id="btn_save">保存</button>
        <span style="flex:1"></span>
        <span class="pill idle" id="stat">未连接</span>
        <label><input type="checkbox" id="step_mode"> 逐帧门控</label>
      </div>
      <div class="warnbox">
        <label style="display:flex;gap:7px;align-items:flex-start;cursor:pointer">
          <input type="checkbox" id="money_ok" style="margin-top:2px">
          <span>本次允许金钱步。只对这一次有效，不保存。不勾则花钱动作直接拒绝。青辉石锁死，关不掉。</span>
        </label>
      </div>
    </div>

    <div class="panel">
      <h2>日常</h2>
      <div id="form_daily"></div>
    </div>

    <div class="panel">
      <h2>推图 / 其它 <span class="sub">不是日常开关</span></h2>
      <div id="form_campaign"></div>
    </div>

    <div class="panel">
      <h2>角色</h2>
      <div class="field">
        <div class="k">当前账号</div>
        <div class="v"><select id="account_id"></select>
          <div class="note">邀请名单和是否跳过按账号存。现在是谁就改谁。</div></div>
      </div>
      <div class="field">
        <div class="k">跳过邀请</div>
        <div class="v"><input type="checkbox" id="skip_invite">
          <div class="note" id="skip_note"></div></div>
      </div>
      <div class="note" style="margin-bottom:6px">咖啡厅邀请。点头像加入，点已选上的叉去掉。按学园分，上面能搜。</div>
      <div id="fav_tray" class="fav-tray empty"></div>
      <input type="text" id="fav_search" class="fav-search" placeholder="搜角色名">
      <div id="char_grid" class="char-grid"></div>
    </div>

    <div class="panel">
      <h2>课程表找人</h2>
      <div class="note" style="margin-bottom:6px">全体课程表里优先点这些人的房间。空=按屏上可见学生排。</div>
      <div id="sched_tray" class="fav-tray empty"></div>
      <input type="text" id="sched_search" class="fav-search" placeholder="搜角色名">
      <div id="sched_grid" class="char-grid"></div>
    </div>

    <div class="panel">
      <h2>体力</h2>
      <div class="note" style="margin-bottom:6px">按日常顺序花完。谁先跑谁花。读不出体力就不动。</div>
      <div id="form_ap"></div>
      <details class="expert" style="margin-top:8px">
        <summary>更多</summary>
        <div id="form_more"></div>
      </details>
    </div>

    <div class="panel">
      <h2>商店策略 <span class="sub">活动商店按规则买，不花青辉石</span></h2>
      <div class="note" style="margin-bottom:6px">高价优先，跳过盒抽。先看货架再编加成队。</div>
      <div id="form_shop"></div>
    </div>

    <div class="panel">
      <h2>金钱</h2>
      <div id="form_safety"></div>
      <div class="note">锁死，界面上看得到，关不掉。</div>
    </div>

    <details class="expert">
      <summary>专家项</summary>
      <div id="form_expert"></div>
    </details>
  </div>

  <div class="col">
    <div class="panel" id="approve" style="display:none">
      <h2 id="approve_title">等你放行</h2>
      <div id="approve_body" class="kv"></div>
      <div class="row" style="margin-top:9px">
        <button class="primary" id="btn_yes">放行这一发</button>
        <button class="danger" id="btn_no">拒绝</button>
      </div>
    </div>

    <div class="panel">
      <h2>现在 <span class="sub" id="elapsed"></span></h2>
      <div class="row kv" id="stats"></div>
      <div id="reports" style="margin-top:8px"></div>
      <table class="bal" id="bal" style="margin-top:8px"></table>
    </div>

    <div class="panel" style="flex:1;display:flex;flex-direction:column;min-height:0">
      <h2>记录
        <span style="flex:1"></span>
        <label class="sub"><input type="checkbox" id="follow" checked> 跟随</label>
      </h2>
      <div id="log" style="flex:1"></div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let SCHEMA = {}, LOCKED = [], CFG = {}, RUNNING = false;
let DAILY_ORDER = [], EXTRA_MODULES = [], EXTRA_LABELS = {};

const api = async (p, o) => {
  const r = await fetch('/v2' + p, o);
  if (!r.ok) throw new Error(await r.text().catch(() => r.status));
  return r.json();
};
const get = (o, path) => path.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
const set = (o, path, v) => {
  const ks = path.split('.');
  let c = o;
  ks.slice(0, -1).forEach(k => { if (typeof c[k] !== 'object' || c[k] === null) c[k] = {}; c = c[k]; });
  c[ks.at(-1)] = v;
};
const labelOf = (sc, o) => (sc.choice_labels && sc.choice_labels[o] != null)
  ? sc.choice_labels[o] : String(o);

const R = {};
R.toggle = (path, sc, val) => {
  const b = document.createElement('input');
  b.type = 'checkbox'; b.checked = !!val;
  b.onchange = () => set(CFG, path, b.checked);
  return b;
};
R.readonly = (path, sc, val) => {
  const s = document.createElement('span');
  s.className = 'pill warn';
  s.textContent = String(val) + '  锁死';
  return s;
};
R.int = R.float = (path, sc, val) => {
  const i = document.createElement('input');
  i.type = 'number'; i.value = val ?? 0;
  if (sc.min != null) i.min = sc.min;
  if (sc.max != null) i.max = sc.max;
  if (sc.kind === 'float') i.step = '0.1';
  i.onchange = () => set(CFG, path, sc.kind === 'float' ? +i.value : Math.round(+i.value));
  return i;
};
R.select = (path, sc, val) => {
  const s = document.createElement('select');
  (sc.options || []).forEach(o => {
    const op = document.createElement('option');
    op.value = String(o); op.textContent = labelOf(sc, o);
    if (String(o) === String(val)) op.selected = true;
    s.appendChild(op);
  });
  s.onchange = () => {
    const raw = s.value;
    const orig = (sc.options || []).find(o => String(o) === raw);
    set(CFG, path, typeof orig === 'number' ? orig : raw);
  };
  return s;
};
R.text = (path, sc, val) => {
  const i = document.createElement('input');
  i.type = 'text'; i.style.width = '100%';
  i.placeholder = sc.placeholder || '';
  i.value = val ?? '';
  i.onchange = () => set(CFG, path, i.value);
  return i;
};
R.farm_rows = (path, sc, val) => {
  const box = document.createElement('div');
  const parseFarm = (v) => {
    if (v && typeof v === 'object' && !Array.isArray(v)) {
      return Object.entries(v).map(([k, n]) => ({
        stage: String(k), count: Math.max(1, Math.round(+n) || 1)
      }));
    }
    if (typeof v === 'string' && v.trim()) {
      const out = [];
      v.split(/[,，]/).forEach(part => {
        const p = part.trim(); if (!p) return;
        if (p.includes(':')) {
          const [k, n] = p.split(':');
          const num = Math.round(+n);
          if (k.trim() && num > 0) out.push({stage: k.trim(), count: num});
        } else out.push({stage: p, count: 1});
      });
      return out;
    }
    return [];
  };
  const rows = parseFarm(val);
  if (!rows.length) rows.push({stage: '', count: 1});
  const sync = () => {
    const out = {};
    rows.forEach(r => {
      const k = String(r.stage || '').trim();
      const n = Math.round(+r.count);
      if (k && n > 0) out[k] = n;
    });
    if (Object.keys(out).length) set(CFG, path, out);
  };
  const draw = () => {
    box.innerHTML = '';
    const tip = document.createElement('div');
    tip.className = 'note';
    tip.textContent = '当前刷关按商店缺货推算倒数关，不认关卡编号。'
      + '有活动点数打最后一关，商店最下档打倒数第二关。'
      + '下面是旧关号配比，存盘仍是 {关号:配比}。当前 event 不读。空=用已存。';
    box.appendChild(tip);
    rows.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'farm-row';
      const l1 = document.createElement('span'); l1.className = 'lab'; l1.textContent = '关号';
      const st = document.createElement('input');
      st.type = 'number'; st.min = 1; st.placeholder = '如 10';
      st.value = r.stage || '';
      st.onchange = () => { r.stage = st.value; sync(); };
      const l2 = document.createElement('span'); l2.className = 'lab'; l2.textContent = '配比';
      const ct = document.createElement('input');
      ct.type = 'number'; ct.min = 1; ct.value = r.count || 1;
      ct.onchange = () => { r.count = Math.max(1, Math.round(+ct.value) || 1); sync(); };
      const del = document.createElement('button');
      del.type = 'button'; del.textContent = '删';
      del.onclick = () => { rows.splice(i, 1); if (!rows.length) rows.push({stage: '', count: 1}); draw(); sync(); };
      row.append(l1, st, l2, ct, del);
      box.appendChild(row);
    });
    const add = document.createElement('button');
    add.type = 'button'; add.className = 'farm-add'; add.textContent = '加一行';
    add.onclick = () => { rows.push({stage: '', count: 1}); draw(); };
    box.appendChild(add);
  };
  draw();
  return box;
};
R.list = (path, sc, val) => {
  const i = document.createElement('input');
  i.type = 'text'; i.style.width = '100%';
  i.value = (val || []).join(', ');
  i.placeholder = sc.placeholder || '逗号分隔';
  i.onchange = () => set(CFG, path,
    i.value.split(/[,，]/).map(s => s.trim()).filter(Boolean));
  return i;
};
R.multi = (path, sc, val) => {
  const box = document.createElement('div');
  const cur = Array.isArray(val) ? val.slice() : [];
  const opts = (sc.options || []).slice();
  const draw = () => {
    box.innerHTML = '';
    const row = document.createElement('div');
    row.className = 'row';
    opts.forEach(o => {
      const c = document.createElement('span');
      c.className = 'chip' + (cur.some(x => String(x) === String(o)) ? ' on' : '');
      c.textContent = labelOf(sc, o);
      c.onclick = () => {
        const at = cur.findIndex(x => String(x) === String(o));
        if (at >= 0) cur.splice(at, 1); else cur.push(o);
        set(CFG, path, cur.slice());
        draw();
      };
      row.appendChild(c);
    });
    box.appendChild(row);
  };
  draw();
  return box;
};
R.map = (path, sc, val) => {
  const box = document.createElement('div');
  const cur = Object.assign({}, val || {});
  const keys = (sc.options || []).slice();
  keys.forEach(k => {
    const r = document.createElement('div'); r.className = 'maprow';
    const nm = document.createElement('span');
    nm.textContent = String(k); nm.style.flex = '1';
    const nu = document.createElement('input');
    nu.type = 'number'; nu.min = 0; nu.value = cur[k] ?? 0;
    nu.onchange = () => {
      const n = Math.round(+nu.value) || 0;
      if (n > 0) cur[k] = n; else delete cur[k];
      set(CFG, path, Object.assign({}, cur));
    };
    r.append(nm, nu);
    box.appendChild(r);
  });
  return box;
};

function pinDaily() {
  CFG.modules = CFG.modules || {};
  DAILY_ORDER.forEach(k => { CFG.modules[k] = true; });
  CFG.modules.batch_sweep = false;
  CFG.modules.special_sweep = false;
  const extra = EXTRA_MODULES.filter(k => CFG.modules[k]);
  CFG.order = DAILY_ORDER.concat(extra);
}

function writeCafeToAccount() {
  const aid = String((CFG.account || {}).id || '').trim();
  if (!aid || !CFG.accounts || !CFG.accounts[aid]) return;
  const cafe = CFG.cafe || {};
  const bc = Object.assign({}, (CFG.accounts[aid].cafe || {}));
  if ('invite_targets' in cafe) bc.invite_targets = (cafe.invite_targets || []).slice();
  if ('skip_invite' in cafe) bc.skip_invite = !!cafe.skip_invite;
  CFG.accounts[aid].cafe = bc;
}

function renderSection(boxId, section) {
  const box = $(boxId); if (!box) return;
  box.innerHTML = '';
  Object.entries(SCHEMA).forEach(([path, sc]) => {
    if ((sc.section || '') !== section) return;
    if (sc.kind === 'toggle_group' || sc.kind === 'order' || sc.kind === 'chars') return;
    if (path === 'account.id' || path === 'cafe.skip_invite') return;
    const f = document.createElement('div'); f.className = 'field';
    const k = document.createElement('div'); k.className = 'k';
    k.textContent = sc.label || path;
    const v = document.createElement('div'); v.className = 'v';
    const locked = LOCKED.includes(path);
    const kind = locked ? 'readonly' : (sc.kind || 'text');
    const fn = R[kind] || R.text;
    v.appendChild(fn(path, sc, get(CFG, path)));
    if (sc.note && sc.kind !== 'farm_rows') {
      const n = document.createElement('div'); n.className = 'note';
      n.textContent = sc.note;
      v.appendChild(n);
    }
    f.append(k, v);
    box.appendChild(f);
  });
}

function renderExtras() {
  const box = $('form_campaign');
  const extra = document.createElement('div');
  extra.className = 'field';
  const k = document.createElement('div'); k.className = 'k'; k.textContent = '另外跑';
  const v = document.createElement('div'); v.className = 'v';
  const row = document.createElement('div'); row.className = 'row';
  EXTRA_MODULES.forEach(name => {
    const c = document.createElement('span');
    c.className = 'chip' + (CFG.modules && CFG.modules[name] ? ' on' : '');
    c.textContent = EXTRA_LABELS[name] || name;
    c.onclick = () => {
      CFG.modules = CFG.modules || {};
      CFG.modules[name] = !CFG.modules[name];
      pinDaily();
      renderForm();
    };
    row.appendChild(c);
  });
  v.appendChild(row);
  extra.append(k, v);
  box.insertBefore(extra, box.firstChild);
}

  renderSection('form_more', 'more');

let allChars = [];
let charElements = {};
let schedElements = {};
function _avatarUrl(fn){ return '/api/v1/captures/image?path=' + encodeURIComponent('角色头像/' + fn); }
function _academyOf(file){
  const stem = (file || '').replace(/\.png$/i,'');
  if (CHAR_ACADEMY[stem]) return CHAR_ACADEMY[stem];
  const base = stem.replace(/_?\(.*\)$/,'').replace(/_.+$/,'');
  return CHAR_ACADEMY[base] || '其他';
}
function inviteList(){ return (get(CFG, 'cafe.invite_targets') || []).slice(); }
function setInvite(list){
  set(CFG, 'cafe.invite_targets', list);
  writeCafeToAccount();
  renderTray();
  applyGridFilter();
  updateSkipNote();
}
function schedList(){ return (get(CFG, 'schedule.target_students') || []).slice(); }
function setSched(list){
  set(CFG, 'schedule.target_students', list);
  renderSchedTray();
  applySchedFilter();
}
function renderTray(){
  const tray = $('fav_tray'); if (!tray) return;
  const list = inviteList();
  tray.innerHTML = '';
  if (!list.length) tray.classList.add('empty');
  else tray.classList.remove('empty');
  list.forEach((cls, idx) => {
    const rec = allChars.find(c => c.cls === cls) || {cls, file: ''};
    const item = document.createElement('div');
    item.className = 'fav-tray-item';
    const badge = document.createElement('span'); badge.className = 'priority-badge'; badge.textContent = '#' + (idx + 1);
    const img = document.createElement('img'); img.className = 'char-avatar';
    if (rec.file) {
      img.src = _avatarUrl(rec.file);
      img.onerror = () => { img.onerror = null; img.src = '/api/v1/synth/portrait/' + encodeURIComponent(cls); };
    } else {
      img.src = '/api/v1/synth/portrait/' + encodeURIComponent(cls);
    }
    const nm = document.createElement('span'); nm.className = 'char-name'; nm.textContent = cls;
    const rm = document.createElement('span'); rm.className = 'remove-btn'; rm.textContent = 'x';
    rm.onclick = e => { e.stopPropagation(); const n = inviteList(); n.splice(idx, 1); setInvite(n); };
    item.append(badge, img, nm, rm);
    tray.appendChild(item);
  });
}
function renderSchedTray(){
  const tray = $('sched_tray'); if (!tray) return;
  const list = schedList();
  tray.innerHTML = '';
  if (!list.length) tray.classList.add('empty');
  else tray.classList.remove('empty');
  list.forEach((cls, idx) => {
    const rec = allChars.find(c => c.cls === cls) || {cls, file: ''};
    const item = document.createElement('div');
    item.className = 'fav-tray-item';
    const badge = document.createElement('span'); badge.className = 'priority-badge'; badge.textContent = '#' + (idx + 1);

    if (rec.file) {
      img.src = _avatarUrl(rec.file);
      img.onerror = () => { img.onerror = null; img.src = '/api/v1/synth/portrait/' + encodeURIComponent(cls); };
    } else {
      img.src = '/api/v1/synth/portrait/' + encodeURIComponent(cls);
    }
    const nm = document.createElement('span'); nm.className = 'char-name'; nm.textContent = cls;
    const rm = document.createElement('span'); rm.className = 'remove-btn'; rm.textContent = 'x';

    item.append(badge, img, nm, rm);
    tray.appendChild(item);
  });
}
function applySchedFilter(){
  const q = ($('sched_search')?.value || '').toLowerCase().trim();
  const selected = new Set(schedList());
  Object.entries(schedElements).forEach(([cls, el]) => {
    const rec = allChars.find(c => c.cls === cls) || {cls, file: ''};
    const hay = (cls + ' ' + (rec.file || '')).toLowerCase();
    el.classList.toggle('hidden', selected.has(cls) || (q && !hay.includes(q)));
  });
  document.querySelectorAll('#sched_grid .char-group-h').forEach(h => {
    let sib = h.nextElementSibling, any = false;
    while (sib && !sib.classList.contains('char-group-h')) {
      if (sib.classList.contains('char-item') && !sib.classList.contains('hidden')) { any = true; break; }
      sib = sib.nextElementSibling;
    }
    h.style.display = any ? '' : 'none';
  });
}
function applyGridFilter(){
  const q = ($('fav_search')?.value || '').toLowerCase().trim();
  const selected = new Set(inviteList());
  Object.entries(charElements).forEach(([cls, el]) => {
    const rec = allChars.find(c => c.cls === cls) || {cls, file: ''};
    const hay = (cls + ' ' + (rec.file || '')).toLowerCase();
    el.classList.toggle('hidden', selected.has(cls) || (q && !hay.includes(q)));
  });
  document.querySelectorAll('#char_grid .char-group-h').forEach(h => {
    let sib = h.nextElementSibling, any = false;
    while (sib && !sib.classList.contains('char-group-h')) {
      if (sib.classList.contains('char-item') && !sib.classList.contains('hidden')) { any = true; break; }
      sib = sib.nextElementSibling;
    }
    h.style.display = any ? '' : 'none';
  });
}
function updateSkipNote(){
  const skip = !!get(CFG, 'cafe.skip_invite');
  const n = inviteList().length;
  $('skip_invite').checked = skip;
  $('skip_note').textContent = skip
    ? ('当前账号跳过邀请' + (n ? '（名单还在，' + n + ' 人，但不去请）' : '（名单是空的）'))
    : (n ? ('按名单请 ' + n + ' 人') : '名单是空的，开着邀请也请不到人');
}
function renderAccount(){
  const sel = $('account_id');
  const ids = Object.keys(CFG.accounts || {});
  const cur = String((CFG.account || {}).id || '');
  if (cur && !ids.includes(cur)) ids.unshift(cur);
  sel.innerHTML = '';
  ids.forEach(id => {
    const op = document.createElement('option');
    op.value = id; op.textContent = id;
    if (id === cur) op.selected = true;
    sel.appendChild(op);
  });
}
function fillCharGrid(grid, store, onPick) {
  grid.innerHTML = '';
  Object.keys(store).forEach(k => { delete store[k]; });
  const groups = {};
  allChars.forEach(c => {
    const a = _academyOf(c.file);
    (groups[a] = groups[a] || []).push(c);
  });
  ACADEMY_ORDER.forEach(acad => {
    const list = groups[acad]; if (!list || !list.length) return;
    const h = document.createElement('div'); h.className = 'char-group-h';
    h.textContent = acad + ' (' + list.length + ')';
    grid.appendChild(h);
    list.forEach(c => {
      const d = document.createElement('div'); d.className = 'char-item';
      d.onclick = () => onPick(c.cls);
      const img = document.createElement('img'); img.className = 'char-avatar'; img.loading = 'lazy';
      if (c.file) {
        img.src = _avatarUrl(c.file);
        img.onerror = () => { img.onerror = null; img.src = '/api/v1/synth/portrait/' + encodeURIComponent(c.cls); };
      } else {
        img.src = '/api/v1/synth/portrait/' + encodeURIComponent(c.cls);
      }
      const sp = document.createElement('span'); sp.className = 'char-name'; sp.textContent = c.cls;
      d.append(img, sp); grid.appendChild(d);
      store[c.cls] = d;
    });
  });
}
async function loadChars(){
  try {
    const r = await api('/characters');
    allChars = Array.isArray(r.characters) ? r.characters : [];
    fillCharGrid($('char_grid'), charElements, cls => {
      const n = inviteList();
      if (n.includes(cls)) return;
      n.push(cls);
      setInvite(n);
    });
    fillCharGrid($('sched_grid'), schedElements, cls => {
      const n = schedList();
      if (n.includes(cls)) return;
      n.push(cls);
      setSched(n);
    });
    renderTray(); applyGridFilter();
    renderSchedTray(); applySchedFilter();
  } catch (e) {
    $('char_grid').innerHTML = '<div class="char-grid-err" onclick="loadChars()">头像加载失败，点击重试</div>';
    if ($('sched_grid')) {
      $('sched_grid').innerHTML = '<div class="char-grid-err" onclick="loadChars()">头像加载失败，点击重试</div>';
    }
  }
}

$('fav_search').addEventListener('input', applyGridFilter);
$('sched_search').addEventListener('input', applySchedFilter);
$('skip_invite').onchange = () => {

$('account_id').onchange = () => {

async function boot() {
  try {
    const s = await api('/schema');
    SCHEMA = s.schema || {};
    LOCKED = s.locked || [];
    DAILY_ORDER = s.daily_order || [];
    EXTRA_MODULES = s.extra_modules || [];
    EXTRA_LABELS = s.extra_labels || {};
    CFG = await api('/config');
    pinDaily();
    $('step_mode').checked = !!get(CFG, 'run.step_mode');
    renderForm();
    renderAccount();
    updateSkipNote();
    await loadChars();
    $('stat').textContent = '就绪'; $('stat').className = 'pill ok';
  } catch (e) {
    $('stat').textContent = '连不上'; $('stat').className = 'pill bad';
  }
}

let lastLog = 0;
async function poll() {
  try {
    const st = await api('/status?tail=400');
    RUNNING = st.running;
    $('btn_run').disabled = RUNNING;
    $('btn_stop').disabled = !RUNNING;
    $('stat').textContent = RUNNING ? '在跑' : (st.halted || '空闲');
    $('stat').className = 'pill ' + (RUNNING ? 'ok' : (st.halted ? 'bad' : 'idle'));
    $('elapsed').textContent = st.elapsed_s ? st.elapsed_s + 's' : '';
    $('stats').innerHTML =
      '步 ' + st.ticks + '  点 ' + st.taps + (st.halted ? '  <span class="pill bad">' + st.halted + '</span>' : '');
    const rep = $('reports'); rep.innerHTML = '';
    (st.reports || []).forEach(r => {
      const d = document.createElement('div');
      d.className = 'kv';
      const cls = /CLEAN/.test(r) ? 'ok' : /LEFTOVER|UNKNOWN/.test(r) ? 'warn' : 'idle';
      d.innerHTML = '<span class="pill ' + cls + '">-</span> ' + String(r).replace(/</g, '&lt;');
      rep.appendChild(d);
    });
    const bal = $('bal'); bal.innerHTML = '';
    Object.entries(st.balances || {}).forEach(([k, v]) => {
      const tr = bal.insertRow();
      tr.insertCell().textContent = k;
      tr.insertCell().textContent = v;
    });
    if (st.log && st.log.length !== lastLog) {
      lastLog = st.log.length;
      $('log').textContent = st.log.join('\n');
      if ($('follow').checked) $('log').scrollTop = $('log').scrollHeight;
    }
    const p = st.pending, box = $('approve');
    if (p) {
      box.style.display = '';
      box.className = 'panel' + (p.money ? ' money' : '');
      $('approve_title').textContent = p.money ? '这一发花钱，要你点头' : '等你放行';
      $('approve_body').innerHTML =
        '<div style="font-size:13px;color:var(--fg);margin-bottom:5px">' +
        String(p.reason || '').replace(/</g, '&lt;') + '</div>' +
        '落点 (' + (p.x ?? 0).toFixed(3) + ', ' + (p.y ?? 0).toFixed(3) + ')' +
        (p.money ? '<br><b style="color:var(--bad)">花钱: ' + (p.spend || '?') + '</b>' : '');
    } else box.style.display = 'none';
  } catch (e) { /* 服务没起时静默重试 */ }
}

async function persist() {
  pinDaily();
  writeCafeToAccount();
  set(CFG, 'run.step_mode', $('step_mode').checked);
  const r = await api('/config', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ config: CFG })
  });
  CFG = r.config;
  pinDaily();
  renderForm();
  renderAccount();
  updateSkipNote();
  renderTray();
  applyGridFilter();
  renderSchedTray();
  applySchedFilter();
  return r;
}

$('btn_run').onclick = async () => {
  await persist();
  const extras = EXTRA_MODULES.filter(n => (CFG.modules || {})[n]);
  const flows = DAILY_ORDER.concat(extras);
  await api('/run', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      flows, step_mode: $('step_mode').checked, money_ok: $('money_ok').checked
    })
  });
};
$('btn_stop').onclick = () => api('/stop', { method: 'POST' });
$('btn_save').onclick = async () => {
  await persist();
  $('stat').textContent = '已保存'; $('stat').className = 'pill ok';
};
$('btn_yes').onclick = () => api('/approve', {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ approve: true })
});
$('btn_no').onclick = () => api('/approve', {
  method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ approve: false })
});

boot();
setInterval(poll, 700);
</script>
